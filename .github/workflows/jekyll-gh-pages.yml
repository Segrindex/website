name: Deploy Jekyll to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ Updated Node (future-proof)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ✅ Safer install
      - name: Install npm dependencies
        run: npm install

      - name: Build with Vite
        run: npm run build

      # ✅ Prepare full Jekyll context
      - name: Prepare Jekyll site
        run: |
          cp -r _layouts dist/ || true
          cp -r _includes dist/ || true
          cp -r _posts dist/ || true
          cp Gemfile dist/Gemfile
          cp Gemfile.lock dist/Gemfile.lock
          cp _config.yml dist/_config.yml
          touch dist/.nojekyll

      # ✅ Ruby (already correct)
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: dist

      # ✅ Explicit build output
      - name: Build with Jekyll
        run: bundle exec jekyll build --destination ./_site --baseurl ""
        working-directory: dist
        env:
          JEKYLL_ENV: production

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
